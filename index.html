<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire de paiement</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --sand: #F4EEE1;
            --card: #FFFEFB;
            --teal: #123F3A;
            --teal-light: #1E5C54;
            --gold: #C89B3C;
            --gold-light: #E4C878;
            --ink: #22271F;
            --muted: #7C8474;
            --line: #DCD3BC;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--sand);
            background-image:
                radial-gradient(circle at 15% 0%, rgba(200, 155, 60, 0.08), transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(18, 63, 58, 0.08), transparent 45%);
            display: flex;
            justify-content: center;
            padding: 48px 20px;
            color: var(--ink);
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        /* ===== RUBAN METEO ===== */
        #weatherWidget {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            background: var(--teal);
            color: #F4EEE1;
            padding: 14px 20px;
            border-radius: 999px;
            box-shadow: 0 6px 16px rgba(18, 63, 58, 0.25);
        }

        #weatherWidget .wx-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #weatherWidget .wx-icon {
            font-size: 22px;
            line-height: 1;
        }

        #weatherWidget .wx-place {
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--gold-light);
            font-weight: 600;
        }

        #weatherWidget .wx-desc {
            font-size: 13px;
            color: #E7E1D2;
            margin-top: 1px;
        }

        #weatherWidget .temp {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 22px;
            font-weight: 500;
            white-space: nowrap;
        }

        /* ===== SEPARATEUR SIGNATURE : rive du lac ===== */
        .shoreline {
            width: 100%;
            height: 22px;
            display: block;
            margin: 6px 0 22px;
        }

        /* ===== FORMULAIRE ===== */
        form {
            background: var(--card);
            padding: 34px 30px 28px;
            border-radius: 20px;
            border: 1px solid var(--line);
            box-shadow: 0 10px 30px rgba(34, 39, 31, 0.08);
            width: 100%;
        }

        form h2 {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: 26px;
            margin: 0 0 4px;
            color: var(--teal);
        }

        form .subtitle {
            font-size: 13px;
            color: var(--muted);
            margin: 0 0 22px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--muted);
        }

        input,
        textarea {
            width: 100%;
            padding: 10px 2px;
            border: none;
            border-bottom: 1.5px solid var(--line);
            border-radius: 0;
            background: transparent;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            color: var(--ink);
            transition: border-color 0.2s ease;
        }

        #montant {
            font-family: 'IBM Plex Mono', monospace;
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-bottom-color: var(--gold);
        }

        input::placeholder,
        textarea::placeholder {
            color: #B7B09A;
        }

        button {
            margin-top: 28px;
            padding: 13px 20px;
            background: var(--teal);
            color: #F4EEE1;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            width: 100%;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.03em;
            transition: background 0.2s ease, transform 0.15s ease;
        }

        button:hover {
            background: var(--teal-light);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background: #B9C4BF;
            cursor: not-allowed;
        }

        .note {
            font-size: 11.5px;
            color: var(--muted);
            margin-top: 14px;
            margin-bottom: 0;
            text-align: center;
        }

        /* ===== BOUTON WHATSAPP ===== */
        #whatsappBtn {
            display: block;
            margin-top: 18px;
            text-align: center;
            animation: fadeUp 0.4s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #whatsappBtn a {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #1F8A5C;
            color: white;
            padding: 13px 20px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
        }

        #whatsappBtn a:hover {
            background: #186E49;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- ===== RUBAN METEO ===== -->
        <div id="weatherWidget">
            <div class="wx-left">
                <span class="wx-icon" id="weatherIcon">🌤️</span>
                <div>
                    <div class="wx-place">Bujumbura</div>
                    <div class="wx-desc" id="weatherDesc">Chargement...</div>
                </div>
            </div>
            <div class="temp" id="weatherTemp">--°C</div>
        </div>

        <!-- ===== SIGNATURE : ligne de rive du lac Tanganyika ===== -->
        <svg class="shoreline" viewBox="0 0 400 22" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0 14 C 40 4, 80 20, 120 10 S 200 2, 240 12 S 320 20, 360 8 S 400 4, 400 4"
                fill="none" stroke="#C89B3C" stroke-width="2" stroke-linecap="round" />
        </svg>

        <!-- ===== FORMULAIRE DE PAIEMENT ===== -->
        <form id="paymentForm">
            <h2>Paiement</h2>
            <p class="subtitle">Renseignez vos informations pour finaliser la demande</p>

            <label for="nom">Nom complet</label>
            <input type="text" id="nom" name="nom" placeholder="Jean Nkurunziza" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="jean@exemple.com" required>

            <label for="telephone">Téléphone</label>
            <input type="tel" id="telephone" name="telephone" placeholder="+257 ..." required>

            <label for="montant">Montant (BIF)</label>
            <input type="number" id="montant" name="montant" min="0" step="1" placeholder="0" required>

            <label for="description">Description du paiement</label>
            <textarea id="description" name="description" rows="3" placeholder="Objet du paiement"></textarea>

            <button type="submit" id="submitBtn">Payer</button>

            <p class="note">Paiement simulé — en attente d'intégration AfriRegister</p>
        </form>

        <div id="whatsappBtn">
            <a id="whatsappLink" href="#" target="_blank">📱 Contactez-nous sur WhatsApp</a>
        </div>

    </div>

    <script>
        // Coordonnées de Bujumbura, Burundi
        const LAT = -3.3822;
        const LON = 29.3644;

        // Table simplifiée des codes météo Open-Meteo → icône + description en français
        const weatherCodes = {
            0: { desc: "Ciel dégagé", icon: "☀️" },
            1: { desc: "Plutôt dégagé", icon: "🌤️" },
            2: { desc: "Partiellement nuageux", icon: "⛅" },
            3: { desc: "Couvert", icon: "☁️" },
            45: { desc: "Brouillard", icon: "🌫️" },
            48: { desc: "Brouillard givrant", icon: "🌫️" },
            51: { desc: "Bruine légère", icon: "🌦️" },
            53: { desc: "Bruine modérée", icon: "🌦️" },
            55: { desc: "Bruine dense", icon: "🌦️" },
            61: { desc: "Pluie légère", icon: "🌧️" },
            63: { desc: "Pluie modérée", icon: "🌧️" },
            65: { desc: "Pluie forte", icon: "🌧️" },
            80: { desc: "Averses légères", icon: "🌦️" },
            81: { desc: "Averses modérées", icon: "🌦️" },
            82: { desc: "Averses violentes", icon: "⛈️" },
            95: { desc: "Orage", icon: "⛈️" }
        };

        async function loadWeather() {
            const iconEl = document.getElementById("weatherIcon");
            const tempEl = document.getElementById("weatherTemp");
            const descEl = document.getElementById("weatherDesc");

            descEl.textContent = "Chargement...";

            try {
                const response = await fetch(
                    `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,weather_code`
                );
                const data = await response.json();

                const temp = Math.round(data.current.temperature_2m);
                const code = data.current.weather_code;
                const weather = weatherCodes[code] || { desc: "Conditions variables", icon: "🌡️" };

                iconEl.textContent = weather.icon;
                tempEl.textContent = `${temp}°C`;
                descEl.textContent = weather.desc;
            } catch (error) {
                descEl.textContent = "Météo indisponible";
                console.error("Erreur météo :", error);
            }
        }

        loadWeather();
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAhJ-6TaSSOzGQIZBwr_N8E71ZatOPfvsM",
            authDomain: "formulaire-paiement.firebaseapp.com",
            projectId: "formulaire-paiement",
            storageBucket: "formulaire-paiement.firebasestorage.app",
            messagingSenderId: "533876722579",
            appId: "1:533876722579:web:74c9c59d79e0bd5aa43666"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const GOOGLE_SHEETS_URL = "https://script.google.com/macros/s/AKfycbz7cZlI_Ao3YTyC8pUEwA4nTaasHOZatFKlHUZT994IzCmBDH4LTM1Be4LDW_9lgIIaAw/exec";

        //  numéro WhatsApp
        const MON_NUMERO_WHATSAPP = "25762458891";

        const form = document.getElementById("paymentForm");
        const submitBtn = document.getElementById("submitBtn");
        const whatsappBtn = document.getElementById("whatsappBtn");
        const whatsappLink = document.getElementById("whatsappLink");

        // Lien WhatsApp par défaut, actif avant tout envoi du formulaire
        whatsappLink.href = `https://wa.me/${MON_NUMERO_WHATSAPP}?text=${encodeURIComponent("Bonjour, j'ai une question sur le paiement.")}`;

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            submitBtn.disabled = true;
            submitBtn.textContent = "Envoi en cours...";

            const paymentData = {
                nom: form.nom.value,
                email: form.email.value,
                telephone: form.telephone.value,
                montant: form.montant.value,
                description: form.description.value,
                statut: "en_attente"
            };

            try {
                await addDoc(collection(db, "paiements"), {
                    ...paymentData,
                    date: new Date()
                });

                await fetch(GOOGLE_SHEETS_URL, {
                    method: "POST",
                    body: JSON.stringify(paymentData),
                    headers: { "Content-Type": "text/plain" }
                });

                const message = `Bonjour, je viens d'effectuer un paiement.%0A%0ANom: ${paymentData.nom}%0AMontant: ${paymentData.montant} BIF%0ADescription: ${paymentData.description}`;
                whatsappLink.href = `https://wa.me/${MON_NUMERO_WHATSAPP}?text=${message}`;

                alert("Paiement enregistré avec succès ! Cliquez sur le bouton WhatsApp ci-dessous pour confirmer.");
                submitBtn.disabled = false;
                submitBtn.textContent = "Payer";
                form.reset();

            } catch (error) {
                console.error("Erreur :", error);
                alert("Erreur lors de l'envoi");
                submitBtn.disabled = false;
                submitBtn.textContent = "Payer";
            }
        });
    </script>

</body>

</html>
